name: Sync Luogu articles

# 把 https://www.luogu.com.cn/user/551389/article 下的全部专栏文章
# 同步为仓库中的 Markdown（posts/<id>.md），并更新 posts/index.md 与
# data/articles.json。
#
# 脚本每次都会重新扫描专栏列表，因此新发表的文章会被自动收录。
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 使用 UTC（北京时间 = UTC + 8）。
    # 每天两个时间窗，降低单个窗口被调度器跳过的影响。
    - cron: "17 3 * * *"
    - cron: "43 13 * * *"
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/sync_articles.py"
      - "scripts/run_sync.py"
      - "tests/**"
      - "data/articles.json"
      - ".github/workflows/sync-luogu-articles.yml"

permissions:
  contents: write

concurrency:
  group: sync-luogu-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test sync discovery
        run: python -m unittest discover -s tests -v

      - name: Sync articles
        env:
          LUOGU_COOKIE: ${{ secrets.LUOGU_COOKIE }}
        run: |
          python scripts/sync_articles.py \
            --uid 551389 \
            --out posts \
            --index posts/index.md

      - name: Commit refreshed posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts README.md data/articles.json
          if git diff --cached --quiet -- posts README.md data/articles.json; then
            echo "没有变化。"
            exit 0
          fi
          git commit -m "chore(posts): 同步洛谷专栏文章"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && exit 0
            echo "push 失败，重试第 $attempt 次"
            sleep 10
          done
          echo "无法推送更新。"
          exit 1
